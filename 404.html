<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 | Achira Sadharanga</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: grid;
            place-items: center;

            background:
                radial-gradient(
                    circle at 70% 20%,
                    rgba(124, 92, 255, 0.18),
                    transparent 35%
                ),
                #07080a;

            color: #ffffff;

            font-family:
                "Inter",
                sans-serif;

            padding: 25px;

            text-align: center;
        }


        .error-container {

            max-width: 850px;
        }


        .error-number {

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size:
                clamp(
                    8rem,
                    25vw,
                    18rem
                );

            line-height: 0.8;

            letter-spacing:
                -0.08em;

            color: transparent;

            -webkit-text-stroke:
                1px rgba(
                    255,
                    255,
                    255,
                    0.45
                );
        }


        .error-label {

            margin-top: 45px;

            color: #a18cff;

            letter-spacing:
                0.18em;

            font-size: 0.7rem;
        }


        h1 {

            margin-top: 16px;

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size:
                clamp(
                    2rem,
                    5vw,
                    4rem
                );

            letter-spacing:
                -0.05em;
        }


        p {

            max-width: 580px;

            margin:
                20px auto 35px;

            color: #9ca3af;

            line-height: 1.8;
        }


        a {

            display:
                inline-flex;

            align-items:
                center;

            gap: 12px;

            padding:
                14px 23px;

            border-radius:
                100px;

            background: white;

            color: #07080a;

            text-decoration: none;

            font-weight: 600;

            transition:
                transform 0.3s ease;
        }


        a:hover {

            transform:
                translateY(-4px);
        }

    </style>

</head>


<body>

    <main class="error-container">

        <div class="error-number">
            404
        </div>

        <p class="error-label">
            PAGE NOT FOUND
        </p>

        <h1>
            This page got lost in the data.
        </h1>

        <p>

            The page you're looking for doesn't exist
            or may have been moved.

        </p>

        <a href="/">

            Return Home

            <span>
                ↗
            </span>

        </a>

    </main>

</body>

</html>
